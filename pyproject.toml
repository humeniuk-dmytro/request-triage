[project]
name = "request-triage"
version = "0.1.0"
description = "LLM-класифікація вхідних запитів AI-юніту: CSV → структурований JSON + звіт"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Google Sheets — важка залежність, потрібна лише для `--sheets`.
# Тримаємо окремо, щоб базовий запуск не тягнув пів-google-cloud.
sheets = [
    "gspread>=6.1",
    "google-auth>=2.35",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
